<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>多选题形态测试页</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6fa;color:#1f2430;
    font:15px/1.75 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .page{max-width:820px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:20px;margin:0 0 6px}
  .meta{color:#6b7688;font-size:13px;margin-bottom:20px}
  .q{background:#fff;border:1px solid #e3e8f0;border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .stem{font-weight:600;margin-bottom:10px}
  .tag{display:inline-block;font-size:12px;font-weight:400;color:#7c3aed;background:#f3e8ff;
    border-radius:6px;padding:1px 7px;margin-right:8px}
  .opts{display:flex;flex-direction:column;gap:6px}

  /* 形态一：原生 checkbox，视觉隐藏，label 包裹 */
  .opt{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid #e6eaf0}
  .opt:has(input:checked){background:#eef4ff;border-color:#a9c4ff}
  .hidden-input{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}

  /* 形态二：input 与 label 分离（label for） */
  .row{display:flex;gap:9px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid #e6eaf0}
  .row input{accent-color:#1f6feb;width:16px;height:16px}
  .row label{cursor:pointer;flex:1}

  /* 形态三：自定义 div，靠 class 表示选中 */
  .opt2{padding:7px 9px;border-radius:8px;border:1px solid #e6eaf0;cursor:pointer}
  .opt2.selected{background:#eef4ff;border-color:#a9c4ff;font-weight:600}
</style>
</head>
<body>
<div class="page">
  <h1>多选题形态测试</h1>
  <div class="meta">三种选项实现：隐藏 checkbox + label 包裹 / input 与 label 分离 / 自定义 div toggle</div>

  <div class="q" id="m1">
    <div class="stem"><span class="tag">多选</span>1. 下列属于传输层协议的是（ ）。</div>
    <div class="opts">
      <label class="opt"><input class="hidden-input" type="checkbox" name="m1" value="A" /><span>A. TCP</span></label>
      <label class="opt"><input class="hidden-input" type="checkbox" name="m1" value="B" /><span>B. IP</span></label>
      <label class="opt"><input class="hidden-input" type="checkbox" name="m1" value="C" /><span>C. UDP</span></label>
      <label class="opt"><input class="hidden-input" type="checkbox" name="m1" value="D" /><span>D. ARP</span></label>
    </div>
  </div>

  <div class="q" id="m2">
    <div class="stem"><span class="tag">多选</span>2. 下列属于关系型数据库的是（ ）。</div>
    <div class="opts">
      <div class="row"><input type="checkbox" id="m2a" name="m2" value="A" /><label for="m2a">A. MySQL</label></div>
      <div class="row"><input type="checkbox" id="m2b" name="m2" value="B" /><label for="m2b">B. Redis</label></div>
      <div class="row"><input type="checkbox" id="m2c" name="m2" value="C" /><label for="m2c">C. PostgreSQL</label></div>
      <div class="row"><input type="checkbox" id="m2d" name="m2" value="D" /><label for="m2d">D. MongoDB</label></div>
    </div>
  </div>

  <div class="q" id="m3">
    <div class="stem"><span class="tag">多选</span>3. 下列属于前端框架的是（ ）。</div>
    <div class="opts">
      <div class="opt2" data-v="A">A. Vue</div>
      <div class="opt2" data-v="B">B. Django</div>
      <div class="opt2" data-v="C">C. React</div>
      <div class="opt2" data-v="D">D. Spring</div>
    </div>
  </div>
</div>
<script>
  document.querySelectorAll('#m3 .opt2').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('selected'));
  });
</script>
</body>
</html>
