<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>图片型题目（用于验证视觉识别）</title>
<style>
  :root{color-scheme:light}*{box-sizing:border-box}
  body{margin:0;background:#f4f6fa;font:15px/1.7 -apple-system,"Microsoft YaHei",system-ui,sans-serif;color:#1f2430}
  .app{max-width:820px;margin:0 auto;padding:26px 18px}
  .card{background:#fff;border:1px solid #e6eaf0;border-radius:14px;padding:22px}
  .tip{font-size:13px;color:#6b7688;margin-bottom:12px}
  canvas{display:block;width:100%;max-width:760px;border:1px solid #e6eaf0;border-radius:10px}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="tip">下面整道题都画在 canvas 上（DOM 里没有文字），用于验证「图片题自动转截图识别」。</div>
    <canvas id="cv" width="1520" height="620"></canvas>
  </div>
</div>
<script>
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#1f2430';
  ctx.font = 'bold 34px "Microsoft YaHei", sans-serif';
  ctx.fillText('1. 下列关于 TCP 协议的说法，正确的是（ ）', 48, 90);
  ctx.font = '30px "Microsoft YaHei", sans-serif';
  const opts = [
    'A. TCP 是无连接协议',
    'B. TCP 提供可靠传输',
    'C. TCP 不保证顺序',
    'D. TCP 工作在网络层'
  ];
  opts.forEach((t, i) => ctx.fillText(t, 76, 170 + i * 62));
  ctx.strokeStyle = '#e3e8f0';
  ctx.strokeRect(30, 30, cv.width - 60, cv.height - 60);
</script>
</body>
</html>
